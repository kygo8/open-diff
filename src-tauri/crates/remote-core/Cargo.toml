[package]
name = "remote-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
hmac = "0.13"
logging-core = { path = "../logging-core" }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11"
suppaftp = { version = "12.1.1", default-features = false, features = ["native-tls", "deprecated"] }
ureq = "3.4.2"

# macOS release DMGs must not depend on Homebrew libssl via libssh2.
[target.'cfg(target_os = "macos")'.dependencies]
ssh2 = { version = "0.9.5", features = ["vendored-openssl"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
ssh2 = "0.9.5"

